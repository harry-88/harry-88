<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 836" width="1200" height="836" fill="none" role="img">
<defs>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#667EEA"/><stop offset=".45" stop-color="#764BA2"/>
    <stop offset=".8" stop-color="#F093FB"/><stop offset="1" stop-color="#FDA085"/>
  </linearGradient>
  <linearGradient id="accentV" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#667EEA"/><stop offset="1" stop-color="#F093FB"/>
  </linearGradient>
  <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#667EEA"/><stop offset="1" stop-color="#667EEA" stop-opacity="0"/>
  </linearGradient>
  <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
    <path d="M34 0H0v34" stroke="#FFFFFF" stroke-opacity=".028" stroke-width="1"/>
  </pattern>
  <filter id="blur" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="58"/>
  </filter>
  <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="5" stdDeviation="9" flood-color="#000" flood-opacity=".42"/>
  </filter>

</defs>
<style>
  text { font-family:'Segoe UI',Roboto,-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif; }
  .mono { font-family:'SFMono-Regular',ui-monospace,Consolas,'Liberation Mono',Menlo,monospace; }
  @keyframes rise   { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:translateY(0); } }
  @keyframes slideL { from { opacity:0; transform:translateX(-22px); } to { opacity:1; transform:translateX(0); } }
  @keyframes fade   { from { opacity:0; } to { opacity:1; } }
  @keyframes grow   { from { transform:scaleX(0); } to { transform:scaleX(1); } }
  @keyframes blink  { 0%,45% { opacity:1; } 55%,100% { opacity:0; } }
  @keyframes drift  { 0%,100% { transform:translate(0,0) scale(1); } 50% { transform:translate(46px,-30px) scale(1.16); } }
  @keyframes drift2 { 0%,100% { transform:translate(0,0) scale(1.1); } 50% { transform:translate(-52px,26px) scale(.9); } }
  @keyframes halo   { 0%,100% { opacity:.34; } 50% { opacity:.8; } }
  @keyframes ping   { 0% { transform:scale(.7); opacity:.85; } 100% { transform:scale(2.6); opacity:0; } }
  @keyframes bob    { 0%,100% { transform:translateY(0); } 50% { transform:translateY(7px); } }
  @keyframes draw   { from { stroke-dashoffset:var(--len); } to { stroke-dashoffset:0; } }
  @keyframes sweep  { 0% { transform:translateX(-100%); } 100% { transform:translateX(100%); } }
  .rise  { animation:rise .85s cubic-bezier(.22,1,.36,1) both; }
  .slide { animation:slideL .85s cubic-bezier(.22,1,.36,1) both; }
  .in    { animation:fade 1s ease both; }
  .bar   { transform-box:fill-box; transform-origin:left center;
            animation:grow 1.15s cubic-bezier(.22,1,.36,1) both; }
  .caret { animation:blink 1.1s steps(1) infinite; }
  .blob  { transform-box:fill-box; transform-origin:center;
            animation:drift 17s ease-in-out infinite; }
  .blob2 { transform-box:fill-box; transform-origin:center;
            animation:drift2 21s ease-in-out infinite; }
  .halo  { animation:halo 4.5s ease-in-out infinite; }
  .ping  { transform-box:fill-box; transform-origin:center;
            animation:ping 2.6s ease-out infinite; }
  .bob   { animation:bob 2.1s ease-in-out infinite; }
  .draw  { stroke-dasharray:var(--len); animation:draw 1.9s ease-out .25s both; }
  @media (prefers-reduced-motion:reduce) {
    .rise,.slide,.in,.bar,.caret,.blob,.blob2,.halo,.ping,.bob,.draw {
      animation:none !important; opacity:1 !important; transform:none !important;
      stroke-dashoffset:0 !important;
    }
  }

</style>
<rect width="1200" height="836" fill="#0D1117"/><rect width="1200" height="836" fill="url(#grid)"/><g filter="url(#blur)" opacity=".26"><circle class="blob" cx="1060" cy="90" r="210" fill="#F093FB"/><circle class="blob2" cx="120" cy="746" r="200" fill="#667EEA"/></g><g class="rise" style="animation-delay:0.10s" filter="url(#soft)"><rect x="70" y="28" width="516" height="232" rx="16" fill="#161B22" stroke="#293138" stroke-width="1"/><path d="M70 44a16 16 0 0 1 16-16h484a16 16 0 0 1 16 16v2H70z" fill="url(#accent)"/><rect x="96" y="54" width="44" height="44" rx="12" fill="#667EEA" fill-opacity=".14"/><text x="118" y="83" font-size="21" text-anchor="middle">🎓</text><text x="154" y="73" font-size="17.5" font-weight="750" fill="#E6EDF3">University LMS</text><text x="154" y="92" font-size="11.5" font-weight="600" letter-spacing=".3" fill="#667EEA">KEAN University · Septems Systems</text><text x="96" y="128" font-size="12.8" fill="#9BA7B4">Spearheaded a fully customized Learning</text><text x="96" y="146" font-size="12.8" fill="#9BA7B4">Management System — courses, enrolment,</text><text x="96" y="164" font-size="12.8" fill="#9BA7B4">assessments and reporting, from scratch.</text><g><rect x="96" y="200" width="74" height="26" rx="13" fill="#FFFFFF" fill-opacity=".06" stroke="#293138" stroke-width="1"/><text x="133.0" y="217.14" font-size="11.5" font-weight="600" fill="#9BA7B4" text-anchor="middle">Next.js</text></g><g><rect x="178" y="200" width="67" height="26" rx="13" fill="#FFFFFF" fill-opacity=".06" stroke="#293138" stroke-width="1"/><text x="211.5" y="217.14" font-size="11.5" font-weight="600" fill="#9BA7B4" text-anchor="middle">NestJS</text></g><g><rect x="253" y="200" width="81" height="26" rx="13" fill="#FFFFFF" fill-opacity=".06" stroke="#293138" stroke-width="1"/><text x="293.5" y="217.14" font-size="11.5" font-weight="600" fill="#9BA7B4" text-anchor="middle">Postgres</text></g><text x="560" y="238" font-size="12" font-weight="700" fill="#667EEA" text-anchor="end">production ●</text></g><g class="rise" style="animation-delay:0.19s" filter="url(#soft)"><rect x="656" y="28" width="516" height="232" rx="16" fill="#161B22" stroke="#293138" stroke-width="1"/><path d="M656 44a16 16 0 0 1 16-16h484a16 16 0 0 1 16 16v2H656z" fill="url(#accent)"/><rect x="682" y="54" width="44" height="44" rx="12" fill="#F093FB" fill-opacity=".14"/><text x="704" y="83" font-size="21" text-anchor="middle">🏥</text><text x="740" y="73" font-size="17.5" font-weight="750" fill="#E6EDF3">Veterinary Oncology Platform</text><text x="740" y="92" font-size="11.5" font-weight="600" letter-spacing=".3" fill="#F093FB">Vet Oncology Partners · Septems</text><text x="682" y="128" font-size="12.8" fill="#9BA7B4">Designed the system for a clinical platform</text><text x="682" y="146" font-size="12.8" fill="#9BA7B4">handling patient records and treatment</text><text x="682" y="164" font-size="12.8" fill="#9BA7B4">workflows in a regulated domain.</text><g><rect x="682" y="200" width="60" height="26" rx="13" fill="#FFFFFF" fill-opacity=".06" stroke="#293138" stroke-width="1"/><text x="712.0" y="217.14" font-size="11.5" font-weight="600" fill="#9BA7B4" text-anchor="middle">React</text></g><g><rect x="750" y="200" width="74" height="26" rx="13" fill="#FFFFFF" fill-opacity=".06" stroke="#293138" stroke-width="1"/><text x="787.0" y="217.14" font-size="11.5" font-weight="600" fill="#9BA7B4" text-anchor="middle">Node.js</text></g><g><rect x="832" y="200" width="46" height="26" rx="13" fill="#FFFFFF" fill-opacity=".06" stroke="#293138" stroke-width="1"/><text x="855.0" y="217.14" font-size="11.5" font-weight="600" fill="#9BA7B4" text-anchor="middle">AWS</text></g><text x="1146" y="238" font-size="12" font-weight="700" fill="#F093FB" text-anchor="end">production ●</text></g><g class="rise" style="animation-delay:0.28s" filter="url(#soft)"><rect x="70" y="288" width="516" height="232" rx="16" fill="#161B22" stroke="#293138" stroke-width="1"/><path d="M70 304a16 16 0 0 1 16-16h48