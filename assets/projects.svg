obile offering —</text><text x="96" y="666" font-size="12.8" fill="#9BA7B4">a fleet of cross-platform apps from a single</text><text x="96" y="684" font-size="12.8" fill="#9BA7B4">React + Ionic codebase.</text><g><rect x="96" y="720" width="60" height="26" rx="13" fill="#FFFFFF" fill-opacity=".06" stroke="#293138" stroke-width="1"/><text x="126.0" y="737.14" font-size="11.5" font-weight="600" fill="#9BA7B4" text-anchor="middle">Ionic</text></g><g><rect x="164" y="720" width="88" height="26" rx="13" fill="#FFFFFF" fill-opacity=".06" stroke="#293138" stroke-width="1"/><text x="208.0" y="737.14" font-size="11.5" font-weight="600" fill="#9BA7B4" text-anchor="middle">Capacitor</text></g><g><rect x="260" y="720" width="81" height="26" rx="13" fill="#FFFFFF" fill-opacity=".06" stroke="#293138" stroke-width="1"/><text x="300.5" y="737.14" font-size="11.5" font-weight="600" fill="#9BA7B4" text-anchor="middle">Appwrite</text></g><text x="560" y="758" font-size="12" font-weight="700" fill="#667EEA" text-anchor="end">production ●</text></g><g class="rise" style="animation-delay:0.55s" filter="url(#soft)"><rect x="656" y="548" width="516" height="232" rx="16" fill="#161B22" stroke="#293138" stroke-width="1"/><path d="M656 564a16 16 0 0 1 16-16h484a16 16 0 0 1 16 16v2H656z" fill="url(#accent)"/><rect x="682" y="574" width="44" height="44" rx="12" fill="#F093FB" fill-opacity=".14"/><text x="704" y="603" font-size="21" text-anchor="middle">🧭</text><text x="740" y="593" font-size="17.5" font-weight="750" fill="#E6EDF3">YOURGUIDE Platform</text><text x="740" y="612" font-size="11.5" font-weight="600" letter-spacing=".3" fill="#F093FB">Startup · sole full stack developer</text><text x="682" y="648" font-size="12.8" fill="#9BA7B4">Took a startup platform from empty repo to</text><text x="682" y="666" font-size="12.8" fill="#9BA7B4">launch, solo — frontend, backend, DB design,</text><text x="682" y="684" font-size="12.8" fill="#9BA7B4">caching and performance tuning.</text><g><rect x="6