<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 550" width="1200" height="550" fill="none" role="img">
<defs>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#667EEA"/><stop offset=".45" stop-color="#764BA2"/>
    <stop offset=".8" stop-color="#F093FB"/><stop offset="1" stop-color="#FDA085"/>
  </linearGradient>
  <linearGradient id="accentV" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#667EEA"/><stop offset="1" stop-color="#F093FB"/>
  </linearGradient>
  <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#667EEA"/><stop offset="1" stop-color="#667EEA" stop-opacity="0"/>
  </linearGradient>
  <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
    <path d="M34 0H0v34" stroke="#FFFFFF" stroke-opacity=".028" stroke-width="1"/>
  </pattern>
  <filter id="blur" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="58"/>
  </filter>
  <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="5" stdDeviation="9" flood-color="#000" flood-opacity=".42"/>
  </filter>

</defs>
<style>
  text { font-family:'Segoe UI',Roboto,-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif; }
  .mono { font-family:'SFMono-Regular',ui-monospace,Consolas,'Liberation Mono',Menlo,monospace; }
  @keyframes rise   { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:translateY(0); } }
  @keyframes slideL { from { opacity:0; transform:translateX(-22px); } to { opacity:1; transform:translateX(0); } }
  @keyframes fade   { from { opacity:0; } to { opacity:1; } }
  @keyframes grow   { from { transform:scaleX(0); } to { transform:scaleX(1); } }
  @keyframes blink  { 0%,45% { opacity:1; } 55%,100% { opacity:0; } }
  @keyframes drift  { 0%,100% { transform:translate(0,0) scale(1); } 50% { transform:translate(46px,-30px) scale(1.16); } }
  @keyframes drift2 { 0%,100% { transform:translate(0,0) scale(1.1); } 50% { transform:translate(-52px,26px) scale(.9); } }
  @keyframes halo   { 0%,100% { opacity:.34; } 50% { opacity:.8; } }
  @keyframes ping   { 0% { transform:scale(.7); opacity:.85; } 100% { transform:scale(2.6); opacity:0; } }
  @keyframes bob    { 0%,100% { transform:translateY(0); } 50% { transform:translateY(7px); } }
  @keyframes draw   { from { stroke-dashoffset:var(--len); } to { stroke-dashoffset:0; } }
  @keyframes sweep  { 0% { transform:translateX(-100%); } 100% { transform:translateX(100%); } }
  .rise  { animation:rise .85s cubic-bezier(.22,1,.36,1) both; }
  .slide { animation:slideL .85s cubic-bezier(.22,1,.36,1) both; }
  .in    { animation:fade 1s ease both; }
  .bar   { transform-box:fill-box; transform-origin:left center;
            animation:grow 1.15s cubic-bezier(.22,1,.36,1) both; }
  .caret { animation:blink 1.1s steps(1) infinite; }
  .blob  { transform-box:fill-box; transform-origin:center;
            animation:drift 17s ease-in-out infinite; }
  .blob2 { transform-box:fill-box; transform-origin:center;
            animation:drift2 21s ease-in-out infinite; }
  .halo  { animation:halo 4.5s ease-in-out infinite; }
  .ping  { transform-box:fill-box; transform-origin:center;
            animation:ping 2.6s ease-out infinite; }
  .bob   { animation:bob 2.1s ease-in-out infinite; }
  .draw  { stroke-dasharray:var(--len); animation:draw 1.9s ease-out .25s both; }
  @media (prefers-reduced-motion:reduce) {
    .rise,.slide,.in,.bar,.caret,.blob,.blob2,.halo,.ping,.bob,.draw {
      animation:none !important; opacity:1 !important; transform:none !important;
      stroke-dashoffset:0 !important;
    }
  }

</style>
<rect width="1200" height="550" fill="#0D1117"/><rect width="1200" height="550" fill="url(#grid)"/><g filter="url(#blur)" opacity=".22"><circle class="blob" cx="140" cy="490" r="200" fill="#667EEA"/></g><rect x="70" y="30" width="1060" height="490" rx="18" fill="#161B22" stroke="#293138" stroke-width="1"/><text x="102" y="70" font-size="17" font-weight="700" fill="#E6EDF3">Where I&#39;m strongest</text><text x="1098" y="70" font-size="12" fill="#6E7A87" text-anchor="end">self-assessed · depth of production use</text><rect x="102" y="88" width="996" height="1" fill="#293138"/><g class="in" style="animation-delay:0.25s"><text x="102" y="127" font-size="14.5" font-weight="650" fill="#E6EDF3">React / Next.js</text><text x="102" y="146" font-size="11.5" fill="#6E7A87">Ant Design · MUI · Redux · Tailwind · RHF</text><rect x="470" y="116" width="500" height="10" rx="5" fill="#FFFFFF" fill-opacity=".055"/><rect x="470" y="116" width="500" height="10" rx="5" fill="url(#accent)" class="bar" style="animation-delay:0.35s"/><circle cx="970" cy="121" r="7" fill="#F093FB" opacity=".35" class="ping" style="animation-delay:1.25s"/><text x="1098" y="125" class="mono" font-size="13" font-weight="700" fill="#9BA7B4" text-anchor="end">100%</text></g><g class="in" style="animation-delay:0.36s"><text x="102" y="189" font-size="14.5" font-weight="650" fill="#E6EDF3">TypeScript / JavaScript</text><text x="102" y="208" font-size="11.5" fill="#6E7A87">Strict typing, shared contracts, monorepos</text><rect x="470" y="178" width="500" height="10" rx="5" fill="#FFFFFF" fill-opacity=".055"/><rect x="470" y="178" width="500" height="10" rx="5" fill="url(#accent)" class="bar" style="animation-delay:0.46s"/><circle cx="970" cy="183" r="7" fill="#F093FB" opacity=".35" class="ping" style="animation-delay:1.36s"/><text x="1098" y="187" class="mono" font-size="13" font-weight="700" fill="#9BA7B4" text-anchor="end">100%</text></g><g class="in" style="animation-delay:0.47s"><text x="102" y="251" font-size="14.5" font-weight="650" fill="#E6EDF3">Node.js / NestJS / Express</text><text x="102" y="270" font-size="11.5" fill="#6E7A87">REST, WebSockets, Firebase Functions, Redis</text><rect x="470" y="240" width="500" height="10" rx="5" fill="#FFFFFF" fill-opacity=".055"/><rect x="470" y="240" width="460" height="10" rx="5" fill="url(#accent)" class="bar" style="animation-delay:0.57s"/><circle cx="930" cy="245" r="7" fill="#F093FB" opacity=".35" class="ping" style="animation-delay:1.47s"/><text x="1098" y="249" class="mono" font-size="13" font-weight="700" fill="#9BA7B4" text-anchor="end">92%</text></g><g class="in" style="animation-delay:0.58s"><text x="102" y="313" font-size="14.5" font-weight="650" fill="#E6EDF3">Ionic / Capacitor</text><text x="102" y="332" font-size="11.5" fill="#6E7A87">~15 cross-platform apps shipped to stores</text><rect x="470" y="302" width="500" height="10" rx="5" fill="#FFFFFF" fill-opacity=".055"/><rect x="470" y="302" width="450" height="10" rx="5" fill="url(#accent)" class="bar" style="animation-delay:0.68s"/><circle cx="920" cy="307" r="7" fill="#F093FB" opacity=".35" class="ping" style="animation-delay:1.58s"/><text x="1098" y="311" class="mono" font-size="13" font-weight="700" fill="#9BA7B4" text-anchor="end">90%</text></g><g class="in" style="animation-delay:0.69s"><text x="102" y="375" font-size="14.5" font-weight="650" fill="#E6EDF3">SQL / NoSQL + ORMs</text><text x="102" y="394" font-size="11.5" fill="#6E7A87">Postgres · MySQL · Mongo · Sequelize/TypeORM/Drizzle</text><rect x="470" y="364" width="500" height="10" rx="5" fill="#FFFFFF" fill-opacity=".055"/><rect x="470" y="364" width="420" height="10" rx="5" fill="url(#accent)" class="bar" style="animation-delay:0.79s"/><circle cx="890" cy="369" r="7" fill="#F093FB" opacity=".35" class="ping" style="animation-delay:1.69s"/><text x="1098" y="373" class="mono" font-size="13" font-weight="700" fill="#9BA7B4" text-anchor="end">84%</text></g><g class="in" style="animation-delay:0.80s"><text x="102" y="437" font-size="14.5" font-weight="650" fill="#E6EDF3">AWS / Docker / CI-CD</text><text x="102" y="456" font-size="11.5" fill="#6E7A87">EC2 · S3 · Nginx · Jenkins · GitHub Actions</text><rect x="470" y="426" width="500" height="10" rx="5" fill="#FFFFFF" fill-opacity=".055"/><rect x="470" y="426" width="380" height="10" rx="5" fill="url(#accent)" class="bar" style="animation-delay:0.90s"/><circle cx="850" cy="431" r="7" fill="#F093FB" opacity=".35" class="ping" style="animation-delay:1.80s"/><text x="1098" y="435" class="mono" font-size="13" font-weight="700" fill="#9BA7B4" text-anchor="end">76%</text></g><g class="in" style="animation-delay:0.91s"><text x="102" y="499" font-size="14.5" font-weight="650" fill="#E6EDF3">Electron</text><text x="102" y="518" font-size="11.5" fill="#6E7A87">3+ desktop apps, offline-first, auto-update</text><rect x="470" y="488" width="500" height="10" rx="5" fill="#FFFFFF" fill-opacity=".055"/><rect x="470" y="488" width="370" height="10" rx="5" fill="url(#accent)" class="bar" style="animation-delay:1.01s"/><circle cx="840" cy="493" r="7" fill="#F093FB" opacity=".35" class="ping" style="animation-delay:1.91s"/><text x="1098" y="497" class="mono" font-size="13" font-weight="700" fill="#9BA7B4" text-anchor="end">74%</text></g>
</svg>
