<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 452" width="1200" height="452" fill="none" role="img">
<defs>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#667EEA"/><stop offset=".45" stop-color="#764BA2"/>
    <stop offset=".8" stop-color="#F093FB"/><stop offset="1" stop-color="#FDA085"/>
  </linearGradient>
  <linearGradient id="accentV" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#667EEA"/><stop offset="1" stop-color="#F093FB"/>
  </linearGradient>
  <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#667EEA"/><stop offset="1" stop-color="#667EEA" stop-opacity="0"/>
  </linearGradient>
  <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
    <path d="M34 0H0v34" stroke="#FFFFFF" stroke-opacity=".028" stroke-width="1"/>
  </pattern>
  <filter id="blur" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="58"/>
  </filter>
  <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="5" stdDeviation="9" flood-color="#000" flood-opacity=".42"/>
  </filter>

</defs>
<style>
  text { font-family:'Segoe UI',Roboto,-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif; }
  .mono { font-family:'SFMono-Regular',ui-monospace,Consolas,'Liberation Mono',Menlo,monospace; }
  @keyframes rise   { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:translateY(0); } }
  @keyframes slideL { from { opacity:0; transform:translateX(-22px); } to { opacity:1; transform:translateX(0); } }
  @keyframes fade   { from { opacity:0; } to { opacity:1; } }
  @keyframes grow   { from { transform:scaleX(0); } to { transform:scaleX(1); } }
  @keyframes blink  { 0%,45% { opacity:1; } 55%,100% { opacity:0; } }
  @keyframes drift  { 0%,100% { transform:translate(0,0) scale(1); } 50% { transform:translate(46px,-30px) scale(1.16); } }
  @keyframes drift2 { 0%,100% { transform:translate(0,0) scale(1.1); } 50% { transform:translate(-52px,26px) scale(.9); } }
  @keyframes halo   { 0%,100% { opacity:.34; } 50% { opacity:.8; } }
  @keyframes ping   { 0% { transform:scale(.7); opacity:.85; } 100% { transform:scale(2.6); opacity:0; } }
  @keyframes bob    { 0%,100% { transform:translateY(0); } 50% { transform:translateY(7px); } }
  @keyframes draw   { from { stroke-dashoffset:var(--len); } to { stroke-dashoffset:0; } }
  @keyframes sweep  { 0% { transform:translateX(-100%); } 100% { transform:translateX(100%); } }
  .rise  { animation:rise .85s cubic-bezier(.22,1,.36,1) both; }
  .slide { animation:slideL .85s cubic-bezier(.22,1,.36,1) both; }
  .in    { animation:fade 1s ease both; }
  .bar   { transform-box:fill-box; transform-origin:left center;
            animation:grow 1.15s cubic-bezier(.22,1,.36,1) both; }
  .caret { animation:blink 1.1s steps(1) infinite; }
  .blob  { transform-box:fill-box; transform-origin:center;
            animation:drift 17s ease-in-out infinite; }
  .blob2 { transform-box:fill-box; transform-origin:center;
            animation:drift2 21s ease-in-out infinite; }
  .halo  { animation:halo 4.5s ease-in-out infinite; }
  .ping  { transform-box:fill-box; transform-origin:center;
            animation:ping 2.6s ease-out infinite; }
  .bob   { animation:bob 2.1s ease-in-out infinite; }
  .draw  { stroke-dasharray:var(--len); animation:draw 1.9s ease-out .25s both; }
  @media (prefers-reduced-motion:reduce) {
    * { animation-duration:.01ms !important; animation-iteration-count:1 !important; }
  }
</style>
<rect width="1200" height="452" fill="#0D1117"/><rect width="1200" height="452" fill="url(#grid)"/><g filter="url(#blur)" opacity=".3"><circle class="blob" cx="168" cy="90" r="189" fill="#667EEA"/><circle class="blob2" cx="983" cy="352" r="171" fill="#F093FB"/><circle class="blob" cx="660" cy="45" r="135" fill="#764BA2"/></g><rect width="1200" height="3" fill="url(#accent)"/><g class="rise" style="animation-delay:.05s"><rect x="72" y="74" width="9" height="9" rx="4.5" fill="#F093FB" class="halo"/><text x="94" y="83" font-size="13" font-weight="700" letter-spacing="2.6" fill="#9BA7B4">SR. FULL STACK ENGINEER</text></g><g class="rise" style="animation-delay:.18s"><text x="70" y="184" font-size="86" font-weight="800" letter-spacing="-2.6" fill="#E6EDF3">Muhammad <tspan fill="url(#accent)">Haris</tspan></text></g><g class="rise" style="animation-delay:.3s"><text x="72" y="232" class="mono" font-size="19" fill="#9BA7B4"><tspan fill="#F093FB">&gt;</tspan> building scalable web, mobile &amp; desktop products<tspan class="caret" fill="#FDA085">_</tspan></text></g><g class="rise" style="animation-delay:.42s"><text x="72" y="284" font-size="16.5" fill="#6E7A87">4+ years turning complex requirements into products people actually ship on. Healthcare, FinTech, E-Commerce, AI &amp; EdTech.</text></g><g class="rise" style="animation-delay:.56s"><text x="72" y="352" font-size="34" font-weight="800" fill="url(#accentV)">4+</text><text x="72" y="374" font-size="10.5" font-weight="700" letter-spacing="1.7" fill="#6E7A87">YEARS</text><rect x="220" y="326" width="1" height="52" fill="#293138"/><text x="262" y="352" font-size="34" font-weight="800" fill="url(#accentV)">20+</text><text x="262" y="374" font-size="10.5" font-weight="700" letter-spacing="1.7" fill="#6E7A87">APPS SHIPPED</text><rect x="410" y="326" width="1" height="52" fill="#293138"/><text x="452" y="352" font-size="34" font-weight="800" fill="url(#accentV)">10+</text><text x="452" y="374" font-size="10.5" font-weight="700" letter-spacing="1.7" fill="#6E7A87">INTEGRATIONS</text><rect x="600" y="326" width="1" height="52" fill="#293138"/><text x="642" y="352" font-size="34" font-weight="800" fill="url(#accentV)">4</text><text x="642" y="374" font-size="10.5" font-weight="700" letter-spacing="1.7" fill="#6E7A87">COMPANIES</text></g><g class="rise" style="animation-delay:.68s"><rect x="72" y="404" width="150" height="34" rx="17" fill="url(#accent)"/><text x="147" y="426" font-size="13.5" font-weight="700" fill="#0D1117" text-anchor="middle">View my work ↓</text><rect x="234" y="404" width="132" height="34" rx="17" fill="none" stroke="#293138" stroke-width="1.4"/><text x="300" y="426" font-size="13.5" font-weight="600" fill="#9BA7B4" text-anchor="middle">Get in touch</text></g><g class="in" style="animation-delay:.7s" opacity=".9"><circle cx="1002" cy="214" r="70" stroke="#293138" stroke-width="1" stroke-dasharray="3 7" opacity="0.9"/><circle cx="1002" cy="214" r="108" stroke="#293138" stroke-width="1" stroke-dasharray="3 7" opacity="0.68"/><circle cx="1002" cy="214" r="146" stroke="#293138" stroke-width="1" stroke-dasharray="3 7" opacity="0.46"/><circle cx="1002" cy="214" r="44" fill="url(#accentV)" opacity=".16"/><circle cx="1002" cy="214" r="44" stroke="#667EEA" stroke-width="1.4" opacity=".55"/><text x="1002" y="223" class="mono" font-size="25" font-weight="700" fill="#E6EDF3" text-anchor="middle">&lt;/&gt;</text><g transform="translate(1002,214)"><circle r="5.5" fill="#667EEA"><animateMotion dur="9s" repeatCount="indefinite" path="M 70 0 A 70 70 0 1 1 -70 0 A 70 70 0 1 1 70 0"/></circle></g><g transform="translate(1002,214)"><circle r="5.5" fill="#F093FB"><animateMotion dur="15s" repeatCount="indefinite" path="M 108 0 A 108 108 0 1 1 -108 0 A 108 108 0 1 1 108 0"/></circle></g><g transform="translate(1002,214)"><circle r="5.5" fill="#FDA085"><animateMotion dur="22s" repeatCount="indefinite" path="M 146 0 A 146 146 0 1 1 -146 0 A 146 146 0 1 1 146 0"/></circle></g></g>
</svg>
